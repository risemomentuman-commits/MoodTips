name: moodtips
description: "Application bien-être avec tips émotionnels"
publish_to: 'none'

version: 1.1.8+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.0.0
  flutter_dotenv: ^5.1.0
  just_audio: ^0.10.5        # ← Corrigé : 2 espaces au lieu de 4
  audio_session: ^0.1.18
  image_picker: ^1.0.4
  fl_chart: ^0.68.0
  flutter_tts: ^4.0.2    # Text-to-Speech
  audioplayers: ^5.2.1 # Musique
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  permission_handler: ^12.0.1
  url_launcher: ^6.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  http: ^1.1.0
  path_provider: ^2.1.2
  health: ^13.3.1  # Apple Health / Google Fit
  device_calendar: ^4.3.3  # Calendrier
  flutter_launcher_icons: ^0.14.1
  package_info_plus: ^9.0.0
  audio_service: ^0.18.18
  just_audio_background: ^0.0.1-beta.17
  share_plus: ^12.0.1
  purchases_flutter: ^9.14.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/audio/relaxation.mp3
    - assets/audio/meditation.mp3
    - assets/audio/energetic.mp3
    - assets/audio/nature_rain.mp3
    - assets/audio/nature_waves.mp3
    - assets/audio/rain.mp3
    - assets/audio/ocean.mp3
    - assets/audio/forest.mp3
    - assets/audio/whitenoise.mp3
    - assets/audio/piano.mp3
    - assets/images/logo.png

    